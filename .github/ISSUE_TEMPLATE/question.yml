name: Question
description: How to express a verification task, or what a result means.
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to prove, on which circuits, and what did you try?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: SymQ version or commit SHA
