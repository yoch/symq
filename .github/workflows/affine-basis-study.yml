name: Affine basis and cache study
on:
  pull_request:
    paths:
      - 'src/symq/labs/affine_basis_study.py'
      - 'src/symq/labs/affine_phase.py'
      - 'src/symq/labs/dyadic_phase.py'
      - 'src/symq/resources.py'
      - 'src/symq/phase.py'
      - 'src/symq/phase_oracle.py'
      - 'benchmarks/affine_basis*.py'
      - 'tests/test_affine_basis*.py'
      - 'tests/testkit/affine_basis_oracle.py'
      - 'docs/guide/affine-basis-study.md'
      - '.github/workflows/affine-basis-study.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: affine-basis-study-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYMQ_SKIP_NATIVE: '1'
      SYMQ_TEST_REQUIRE: checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: >-
          python -m pytest -q tests/test_affine_basis_study.py
          tests/test_affine_basis_qualification.py tests/test_affine_phase.py
          tests/test_public_docs.py tests/test_public_api.py
      - run: >-
          python -m benchmarks.affine_basis --repetitions 3
          --output evidence/affine-basis.json
      - run: >-
          python -m benchmarks.affine_basis_summary evidence/affine-basis.json
          --output evidence/affine-basis-summary.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: affine-basis-study-evidence
          path: evidence/
          if-no-files-found: error
