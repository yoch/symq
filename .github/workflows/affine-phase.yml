name: Affine phase research
on:
  pull_request:
    paths:
      - 'src/symq/labs/affine_phase.py'
      - 'src/symq/labs/dyadic_phase.py'
      - 'src/symq/phase.py'
      - 'src/symq/resources.py'
      - 'tests/test_affine_phase*.py'
      - 'tests/testkit/affine_phase_oracle.py'
      - 'benchmarks/affine_phase.py'
      - 'docs/guide/affine-phase.md'
      - '.github/workflows/affine-phase.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: affine-phase-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat,checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: >-
          python -m pytest -q tests/test_affine_phase.py
          tests/test_affine_phase_qualification.py tests/test_phase8_research.py
          tests/test_public_docs.py tests/test_public_api.py
      - run: python -m benchmarks.affine_phase --repetitions 3 --output evidence/affine-phase.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: affine-phase-evidence
          path: evidence/
          if-no-files-found: error
