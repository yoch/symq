name: Anchored Kraus symbolic research
on:
  pull_request:
    paths:
      - 'src/symq/labs/anchored_kraus.py'
      - 'benchmarks/anchored_kraus.py'
      - 'tests/test_anchored_kraus.py'
      - 'docs/labs/research-outlook-20261102.md'
      - '.github/workflows/anchored-kraus.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q tests/test_anchored_kraus.py tests/test_hmr_table_contract.py
      - run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/tree.txt
          git diff --exit-code
          python -m benchmarks.anchored_kraus --programs 400 --output evidence/anchored-kraus.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: anchored-kraus-evidence
          path: evidence/
          if-no-files-found: error
