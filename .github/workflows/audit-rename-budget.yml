name: Native rename budget propagation audit
on:
  push:
    branches: [audit/symq103-native-rename-budget-20261029]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,native]"
      - run: python tools/build_native.py --require
      - run: |
          set -o pipefail
          python -m pytest -q -rx tests/test_rename_budget_propagation.py | tee /tmp/rename-budget.txt
          grep -q '1 passed, 1 xfailed' /tmp/rename-budget.txt
