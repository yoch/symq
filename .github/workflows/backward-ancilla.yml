name: Backward ancilla research
on:
  push:
    branches: [main]
    paths:
      - 'src/symq/labs/backward_ancilla.py'
      - 'src/symq/experimental/hybrid.py'
      - 'src/symq/resources.py'
      - 'benchmarks/backward_ancilla.py'
      - 'benchmarks/corpus/qualtran/**'
      - 'tests/test_backward_ancilla*.py'
      - '.github/workflows/backward-ancilla.yml'
  pull_request:
    paths:
      - 'src/symq/labs/backward_ancilla.py'
      - 'src/symq/experimental/hybrid.py'
      - 'src/symq/resources.py'
      - 'benchmarks/backward_ancilla.py'
      - 'benchmarks/corpus/qualtran/**'
      - 'tests/test_backward_ancilla*.py'
      - '.github/workflows/backward-ancilla.yml'
permissions:
  contents: read
concurrency:
  group: backward-ancilla-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
        env:
          SYMQ_SKIP_NATIVE: '1'
      - run: >-
          python -m pytest -q tests/test_backward_ancilla.py
          tests/test_backward_ancilla_qualification.py
          tests/test_hybrid_channel_research.py tests/test_public_docs.py
      - run: python -m benchmarks.backward_ancilla --repetitions 3 --output evidence/backward-ancilla.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backward-ancilla-evidence
          path: evidence/
          if-no-files-found: error
