name: HMR certificate research
on:
  pull_request:
    paths:
      - 'src/symq/**'
      - 'tests/test_channel_certificate*.py'
      - 'benchmarks/channel_certificate.py'
      - 'benchmarks/corpus/**'
      - 'docs/guide/channel-certificates.md'
      - 'pyproject.toml'
      - '.github/workflows/channel-certificates.yml'
  push:
    branches: [main]
    paths:
      - 'src/symq/**'
      - 'tests/test_channel_certificate*.py'
      - 'benchmarks/channel_certificate.py'
      - 'benchmarks/corpus/**'
      - '.github/workflows/channel-certificates.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-channel-certificates-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYMQ_SKIP_NATIVE: '1'
      SYMQ_TEST_REQUIRE: checkout
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_channel_certificate.py tests/test_channel_certificate_qualification.py tests/test_channel_criterion.py tests/test_public_api.py
      - name: Reproduce bounded development qualification
        run: python -m benchmarks.channel_certificate --repetitions 3 --output evidence/channel-certificates.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: channel-certificates-evidence
          path: evidence/
          if-no-files-found: error
