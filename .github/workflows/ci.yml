name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      # This job must exercise the C core, the SAT engine and the checkout-only provenance tests:
      # a failed native build, a missing solver or a package imported from outside the checkout
      # fails the job instead of silently skipping the corresponding tests.
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat,checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q --durations=25
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      # Configuration in pyproject.toml: the core is checked, experimental/labs are gradual.
      - run: mypy
  macos:
    # The native core must build and load on macOS (clang, -undefined dynamic_lookup).
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m symq doctor --require-native
      - run: python -m pytest -q tests/test_zdd_native.py tests/test_native_limits.py tests/test_equivalence.py tests/test_backends.py tests/test_sat_equivalence.py tests/test_cli_check.py tests/test_public_api.py
  pure-python:
    # The C core is optional: without it every other backend must still work.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMQ_TEST_REQUIRE: sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      - run: python -c "from symq import BACKENDS; assert 'zdd-native' not in BACKENDS and 'zdd' in BACKENDS"
      # The SAT engine does not need the C extension, and its tests must really run: a green job
      # that skips them validates nothing.
      - run: python -c 'import symq.sat, sys; sys.exit(0 if symq.sat.available() else 1)'
      - run: python -m pytest -q tests/test_sat_equivalence.py tests/test_sat_timeout.py tests/test_sat_availability.py
      # Native-only tests carry the ``native`` marker (see tests/conftest.py).
      - run: python -m pytest -q -m "not native"
  wheel:
    # Only src/symq ships: the installed wheel must import and find its native core
    # without the source tree.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - native: true
            skip_native: ''
            require_native: '1'
            test_require: native,sat
          - native: false
            skip_native: '1'
            require_native: ''
            test_require: sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps -w dist .
        env:
          SYMQ_REQUIRE_NATIVE: ${{ matrix.require_native }}
          SYMQ_SKIP_NATIVE: ${{ matrix.skip_native }}
      - run: python -m venv /tmp/wheel-venv && /tmp/wheel-venv/bin/pip install dist/*.whl
      - name: The sdist builds, installs and passes the test suite on its own
        # The suite runs inside the extracted tarball against the installed package, so a file
        # missing from the sdist fails here. Checkout-only provenance tests skip with a reason.
        run: |
          python -m pip install build
          python -m build --sdist -o sdist .
          python -m venv /tmp/sdist-venv
          tarball=$(ls sdist/*.tar.gz)
          /tmp/sdist-venv/bin/pip install "${tarball}[test]"
          mkdir /tmp/sdist-src && tar xzf "$tarball" -C /tmp/sdist-src --strip-components=1
          cd /tmp/sdist-src && /tmp/sdist-venv/bin/python -m pytest -q -p no:cacheprovider
        env:
          SYMQ_REQUIRE_NATIVE: ${{ matrix.require_native }}
          SYMQ_SKIP_NATIVE: ${{ matrix.skip_native }}
          SYMQ_TEST_REQUIRE: ${{ matrix.test_require }}
      - run: /tmp/wheel-venv/bin/python -m symq doctor --require-native
        if: matrix.native
        working-directory: /tmp
      - name: Verify installed experimental API outside checkout
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/symq inspect "$GITHUB_WORKSPACE/examples/experimental/candidate.json" --json
          /tmp/wheel-venv/bin/symq verify "$GITHUB_WORKSPACE/examples/experimental/reference.json" "$GITHUB_WORKSPACE/examples/experimental/candidate.json" --contract "$GITHUB_WORKSPACE/examples/experimental/contract.json" --report /tmp/symq-result.json
          /tmp/wheel-venv/bin/symq replay /tmp/symq-result.json
          /tmp/wheel-venv/bin/symq profile "$GITHUB_WORKSPACE/examples/experimental/reference.json" "$GITHUB_WORKSPACE/examples/experimental/candidate.json" --contract "$GITHUB_WORKSPACE/examples/experimental/contract.json" --report /tmp/symq-profile.json --html /tmp/symq-profile.html
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,external]"
      - run: python -c "from symq import external; assert not external.UNAVAILABLE, external.UNAVAILABLE; print(external.versions())"
      - run: python -m pytest -q tests/test_external.py tests/test_phase8_external.py tests/test_experimental_phases.py
      # SAT against MQT QCEC on the arithmetic substitution pairs; fails on any mismatch.
      - run: python -m benchmarks.substitution_crosscheck --output evidence/substitution-crosscheck.json
      # Comparative development campaign on this exact commit (not a holdout): 13 cases and 35
      # coverage cells once, then four preregistered cases with 15 paired repetitions.
      - run: python -m benchmarks.comparative --output evidence/comparative-coverage.json --repetitions 1
      - run: python -m benchmarks.comparative_report --input evidence/comparative-coverage.json --output evidence/comparative-coverage.md
      - run: >-
          python -m benchmarks.comparative --output evidence/comparative-paired.json --repetitions 15
          --case kmb-gf16-original-vs-tower
          --case borrowed-dirty-missing-uncompute
          --case qualtran-m1-hmr-cleanup
          --case qualtran-m1-hmr-missing-correction
      - run: python -m benchmarks.comparative_report --input evidence/comparative-paired.json --output evidence/comparative-paired.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: external-evidence
          path: evidence/
  research-evidence:
    # Regenerates the pinned research reports; each command fails on a broken claim.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # The four Qualtran cases through symq rewrite --isolate and symq replay, on versioned files.
      - run: python -m benchmarks.rewrite_qualtran_hmr --output-dir evidence/qualtran-hmr-cli
      # The public gf16-07 KMB in a 13-wire context, through the CLI, with its three refusals.
      - run: python -m benchmarks.rewrite_kmb_context --output-dir evidence/kmb-context-cli
      - run: python -m benchmarks.bilinear_kmb --output evidence/bilinear-kmb.json
      - run: python -m benchmarks.gf24_tower_qualification --output evidence/gf24-tower.json
      - run: python -m benchmarks.substitution_qualification --output evidence/substitution-qualification.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-evidence
          path: evidence/
  quick-bench:
    # Informational: relative timings for review, published as an artifact. Never blocks.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m benchmarks.quick --split dev --output bench-dev.json
          python -m benchmarks.quick --split synthetic --backends zdd-native sat --output bench-synthetic.json
      - uses: actions/upload-artifact@v4
        with:
          name: quick-bench
          path: bench-*.json
  sanitizers:
    # AddressSanitizer + UndefinedBehaviorSanitizer build of the C core, in a scratch copy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_REQUIRE_NATIVE: '1'
      - run: python tools/sanitize_native.py

  p2-rewrite-cli:
    # qant-driven contract: no flat or empty early-timeout status, correct
    # native diagnostics, safe total-engine selection and exact cut location.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMQ_SKIP_NATIVE: '1'
      SYMQ_TEST_REQUIRE: sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Enforce SAT availability and absent native core
        run: |
          python -c 'import symq.sat, sys; sys.exit(0 if symq.sat.available() else 1)'
          python -c 'from symq.backends import has_native; assert not has_native()'
      - name: P2 JSON, semantic engine and injective cut mapping regressions
        run: >-
          python -m pytest -q tests/test_cli_rewrite_json.py
          tests/test_rewrite_engine.py tests/test_rewrite_locator.py tests/test_rewrite_cli.py
      - name: Locate an exact real span without treating advice as proof
        run: |
          python -m symq locate examples/locate/source.json examples/locate/reference.json --theorem classical > p2-locate.json
          python -c 'import json; d=json.load(open("p2-locate.json")); assert d["advisory_only"] and d["status"]=="unique" and d["matches"][0]["wires"]==[4,1,6] and d["matches"][0]["span"]==[1,3]'
      - name: Safe opt-in auto engine and full replay
        run: |
          python -m symq rewrite examples/rewrite/request.json --engine auto --report p2-rewrite.json > p2-status.json
          python -m symq replay p2-rewrite.json > p2-replay.json
          python -c 'import json; s=json.load(open("p2-status.json")); r=json.load(open("p2-replay.json")); assert s["result"]["engine"]=="sat" and s["result"]["outcome"]=="equivalent" and r["replay"]["reverified"]'
      - name: Publish reproducible P2 CLI receipts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p2-rewrite-cli
          path: |
            p2-locate.json
            p2-rewrite.json
            p2-replay.json
            p2-status.json
