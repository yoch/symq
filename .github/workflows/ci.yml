name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      # This job must exercise the C core, the SAT engine and the checkout-only provenance tests:
      # a failed native build, a missing solver or a package imported from outside the checkout
      # fails the job instead of silently skipping the corresponding tests.
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat,checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q --durations=25
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      # Configuration in pyproject.toml: the core is checked, experimental/labs are gradual.
      - run: mypy
  macos:
    # The native core must build and load on macOS (clang, -undefined dynamic_lookup).
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m symq doctor --require-native
      - run: python -m pytest -q tests/test_zdd_native.py tests/test_native_limits.py tests/test_equivalence.py tests/test_backends.py tests/test_sat_equivalence.py tests/test_cli_check.py tests/test_public_api.py
  pure-python:
    # The C core is optional: without it every other backend must still work.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMQ_TEST_REQUIRE: sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      - run: python -c "from symq import BACKENDS; assert 'zdd-native' not in BACKENDS and 'zdd' in BACKENDS"
      # The SAT engine does not need the C extension, and its tests must really run: a green job
      # that skips them validates nothing.
      - run: python -c 'import symq.sat, sys; sys.exit(0 if symq.sat.available() else 1)'
      - run: python -m pytest -q tests/test_sat_equivalence.py tests/test_sat_timeout.py tests/test_sat_availability.py
      # Native-only tests carry the ``native`` marker (see tests/conftest.py).
      - run: python -m pytest -q -m "not native"
  wheel:
    # Only src/symq ships: the installed wheel must import and find its native core
    # without the source tree.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - native: true
            skip_native: ''
            require_native: '1'
            test_require: native,sat
          - native: false
            skip_native: '1'
            require_native: ''
            test_require: sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps -w dist .
        env:
          SYMQ_REQUIRE_NATIVE: ${{ matrix.require_native }}
          SYMQ_SKIP_NATIVE: ${{ matrix.skip_native }}
      - run: python -m venv /tmp/wheel-venv && /tmp/wheel-venv/bin/pip install dist/*.whl
      - name: The sdist builds, installs and passes the test suite on its own
        # The suite runs inside the extracted tarball against the installed package, so a file
        # missing from the sdist fails here. Checkout-only provenance tests skip with a reason.
        run: |
          python -m pip install build
          python -m build --sdist -o sdist .
          python -m venv /tmp/sdist-venv
          tarball=$(ls sdist/*.tar.gz)
          /tmp/sdist-venv/bin/pip install "${tarball}[test]"
          mkdir /tmp/sdist-src && tar xzf "$tarball" -C /tmp/sdist-src --strip-components=1
          cd /tmp/sdist-src && /tmp/sdist-venv/bin/python -m pytest -q -p no:cacheprovider
        env:
          SYMQ_REQUIRE_NATIVE: ${{ matrix.require_native }}
          SYMQ_SKIP_NATIVE: ${{ matrix.skip_native }}
          SYMQ_TEST_REQUIRE: ${{ matrix.test_require }}
      - run: /tmp/wheel-venv/bin/python -m symq doctor --require-native
        if: matrix.native
        working-directory: /tmp
      - name: Verify installed experimental API outside checkout
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/symq inspect "$GITHUB_WORKSPACE/examples/experimental/candidate.json" --json
          /tmp/wheel-venv/bin/symq verify "$GITHUB_WORKSPACE/examples/experimental/reference.json" "$GITHUB_WORKSPACE/examples/experimental/candidate.json" --contract "$GITHUB_WORKSPACE/examples/experimental/contract.json" --report /tmp/symq-result.json
          /tmp/wheel-venv/bin/symq replay /tmp/symq-result.json
          /tmp/wheel-venv/bin/symq profile "$GITHUB_WORKSPACE/examples/experimental/reference.json" "$GITHUB_WORKSPACE/examples/experimental/candidate.json" --contract "$GITHUB_WORKSPACE/examples/experimental/contract.json" --report /tmp/symq-profile.json --html /tmp/symq-profile.html
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,external]"
      - run: python -c "from symq import external; assert not external.UNAVAILABLE, external.UNAVAILABLE; print(external.versions())"
      - run: python -m pytest -q tests/test_external.py tests/test_phase8_external.py tests/test_experimental_phases.py
      - name: Compare full reversible permutations against SAT and QCEC
        run: >-
          python -m benchmarks.substitution_crosscheck
          --output substitution-crosscheck.json --repetitions 1 --wall-seconds 20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: substitution-qcec-sat-baselines
          path: |
            substitution-crosscheck.json
            substitution-crosscheck.json.sha256
  quick-bench:
    # Informational: relative timings for review, published as an artifact. Never blocks.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m benchmarks.quick --split dev --output bench-dev.json
          python -m benchmarks.quick --split synthetic --backends zdd-native sat --output bench-synthetic.json
      - uses: actions/upload-artifact@v4
        with:
          name: quick-bench
          path: bench-*.json
  sanitizers:
    # AddressSanitizer + UndefinedBehaviorSanitizer build of the C core, in a scratch copy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_REQUIRE_NATIVE: '1'
      - run: python tools/sanitize_native.py

  substitution-qualification:
    # Source-pinned semantic coverage, not a performance or independent-holdout claim.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMQ_TEST_REQUIRE: sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      - name: Reproduce the 22-case substitution matrix in isolated workers
        run: >-
          python -m benchmarks.substitution_qualification
          --output substitution-qualification.json --repetitions 1 --wall-seconds 45
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: substitution-qualification
          path: |
            substitution-qualification.json
            substitution-qualification.json.sha256


  kaggle-bilinear:
    # Separate public open-set corpus: source fingerprints and exact full-state model,
    # never an independent blind holdout or Kaggle competition-score benchmark.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      - name: Verify original KMB bytes, general GF(2) scheduler and full contexts
        run: python -m pytest -q tests/test_kaggle_bilinear.py tests/test_bilinear_optimization.py
      - name: Emit source-pinned candidate KMB files and evaluation report
        run: >-
          python -m benchmarks.kaggle_bilinear_eval
          --output kaggle-bilinear-evaluation.json
          --candidate-dir kaggle-bilinear-candidates
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-kaggle-bilinear-evaluation
          path: |
            kaggle-bilinear-evaluation.json
            kaggle-bilinear-evaluation.json.sha256
            kaggle-bilinear-candidates/

  gf24-tower:
    # This is a mathematical tensor/cost qualification of GF24 research,
    # not a sealed holdout, HMR proof, independent SAT certificate or Kaggle score.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      - name: Exact GF24 tensor, negative mutants and independent arithmetic oracle
        run: python -m pytest -q tests/test_gf24_tower.py
      - name: Produce pinned GF24 factor and gate cost report
        run: >-
          python -m benchmarks.gf24_tower_qualification
          --output gf24-tower-qualification.json
      - name: Confirm the restricted 96-basis CX sweep and chosen representation
        run: >-
          python -m benchmarks.gf24_basis_scan
          --output gf24-basis-scan.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gf24-tower-qualification
          path: |
            gf24-tower-qualification.json
            gf24-tower-qualification.json.sha256
            gf24-basis-scan.json
            gf24-basis-scan.json.sha256

  bilinear-exact:
    # Exact local full-unitary theorem on a strictly enforced CX/CCX
    # triangular bilinear grammar; no SAT or HMR claims.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      - name: Adversarial exact bilinear theorem, frozen replay and context tests
        run: python -m pytest -q tests/test_bilinear_exact_substitution.py
      - name: Produce independently rechecked full-unitary rewrite receipt
        run: >-
          python -m benchmarks.bilinear_exact_proof
          --output bilinear-exact-proof.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bilinear-exact-proof
          path: |
            bilinear-exact-proof.json
            bilinear-exact-proof.json.sha256
