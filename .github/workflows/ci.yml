name: CI
# Required checks for the maintained package. Research evidence and informational timings run
# in research.yml. Branch protection should require the single job ``ci-ok``.
on:
  push:
    branches: [main, 'release/**']
  pull_request:
  # A merge queue reports required checks from this event; without it ``ci-ok`` would never
  # report there and the queue would wait forever.
  merge_group:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Only a pull request's superseded run is cancelled. On main and release branches every pushed
  # commit keeps its own result: a cancelled run would leave ``ci-ok`` red on a good commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    env:
      # This job must exercise the C core, the SAT engine and the checkout-only provenance tests:
      # a failed native build, a missing solver or a package imported from outside the checkout
      # fails the job instead of silently skipping the corresponding tests.
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat,checkout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      # Tests that assert a ceiling on real elapsed time carry the ``timing`` marker and run in a
      # serial step: under xdist the other workers decide whether such a ceiling holds.
      - run: python -m pytest -q -n auto -m "not timing" --durations=25
      - run: python -m pytest -q -m timing
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      # Configuration in pyproject.toml: the core is checked, experimental/labs are gradual.
      - run: mypy
  macos:
    # The native core must build and load on macOS (clang, -undefined dynamic_lookup), and the
    # whole core tier must pass there: the release workflow builds macOS wheels.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m symq doctor --require-native
      - run: python -m pytest -q -n auto -m "core and not timing" --durations=25
      - run: python -m pytest -q -m "core and timing"
      # Not in the core tier (it reads the layer boundaries of symq.labs), but platform-neutral
      # and part of what this job ran before it ran the tier.
      - run: python -m pytest -q tests/test_public_api.py
  windows-pure:
    # The C core is not ported to Windows: the package must install there as pure Python by
    # itself, without being told to skip the core, and the core tier must pass.
    # Steps run in bash so that every job uses one shell.
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      SYMQ_TEST_REQUIRE: sat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      # No SYMQ_SKIP_NATIVE: the build must decide by itself not to compile (the runner has a
      # MinGW gcc on PATH, which must not be used).
      - run: python -m pip install -e ".[test]"
      - run: python -c "from symq import BACKENDS; assert 'zdd-native' not in BACKENDS and 'zdd' in BACKENDS"
      - run: python -m symq doctor
      # --collect-tier: some research test modules import POSIX-only modules and cannot even be
      # collected here; '-m core' alone would import them before deselecting their tests.
      - run: python -m pytest -q -n auto --collect-tier core -m "core and not native and not timing" --durations=25
      - run: python -m pytest -q --collect-tier core -m "core and not native and timing"
  qcec-crosscheck:
    # SymQ's verdicts against MQT QCEC, the one implementation in the loop that shares no code
    # with SymQ. Required: a wrong 'equivalent' is the worst failure of this library. A missing
    # QCEC is an error here, not a skip. The broader comparative campaign (PolyBoRi, CUDD,
    # repeated benchmarks) stays advisory in research.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat,qcec
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[test,crosscheck]"
      - run: python -m pytest -q tests/test_qcec_crosscheck.py tests/test_external.py -k qcec
  pure-python:
    # The C core is optional: without it every other backend must still work.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYMQ_TEST_REQUIRE: sat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_SKIP_NATIVE: '1'
      - run: python -c "from symq import BACKENDS; assert 'zdd-native' not in BACKENDS and 'zdd' in BACKENDS"
      # The SAT engine does not need the C extension, and its tests must really run: a green job
      # that skips them validates nothing.
      - run: python -c 'import symq.sat, sys; sys.exit(0 if symq.sat.available() else 1)'
      - run: python -m pytest -q tests/test_sat_equivalence.py tests/test_sat_timeout.py tests/test_sat_availability.py
      # Native-only tests carry the ``native`` marker (see tests/conftest.py).
      - run: python -m pytest -q -n auto -m "not native and not timing"
      - run: python -m pytest -q -m "timing and not native"
  wheel:
    # Only src/symq ships: the installed wheel must import and find its native core
    # without the source tree.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        include:
          - native: true
            skip_native: ''
            require_native: '1'
            test_require: native,sat
          - native: false
            skip_native: '1'
            require_native: ''
            test_require: sat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip wheel --no-deps -w dist .
        env:
          SYMQ_REQUIRE_NATIVE: ${{ matrix.require_native }}
          SYMQ_SKIP_NATIVE: ${{ matrix.skip_native }}
      - run: python -m venv /tmp/wheel-venv && /tmp/wheel-venv/bin/pip install dist/*.whl
      - name: The sdist builds, installs and passes the test suite on its own
        # The suite runs inside the extracted tarball against the installed package, so a file
        # missing from the sdist fails here. Checkout-only provenance tests skip with a reason.
        run: |
          python -m pip install build
          python -m build --sdist -o sdist .
          python -m venv /tmp/sdist-venv
          tarball=$(ls sdist/*.tar.gz)
          /tmp/sdist-venv/bin/pip install "${tarball}[test]"
          mkdir /tmp/sdist-src && tar xzf "$tarball" -C /tmp/sdist-src --strip-components=1
          cd /tmp/sdist-src
          /tmp/sdist-venv/bin/python -m pytest -q -n auto -m "not timing" -p no:cacheprovider
          /tmp/sdist-venv/bin/python -m pytest -q -m timing -p no:cacheprovider
        env:
          SYMQ_REQUIRE_NATIVE: ${{ matrix.require_native }}
          SYMQ_SKIP_NATIVE: ${{ matrix.skip_native }}
          SYMQ_TEST_REQUIRE: ${{ matrix.test_require }}
      - run: /tmp/wheel-venv/bin/python -m symq doctor --require-native
        if: matrix.native
        working-directory: /tmp
      - name: Verify installed experimental API outside checkout
        working-directory: /tmp
        run: |
          /tmp/wheel-venv/bin/symq inspect "$GITHUB_WORKSPACE/examples/experimental/candidate.json" --json
          /tmp/wheel-venv/bin/symq verify "$GITHUB_WORKSPACE/examples/experimental/reference.json" "$GITHUB_WORKSPACE/examples/experimental/candidate.json" --contract "$GITHUB_WORKSPACE/examples/experimental/contract.json" --report /tmp/symq-result.json
          /tmp/wheel-venv/bin/symq replay /tmp/symq-result.json
          /tmp/wheel-venv/bin/symq profile "$GITHUB_WORKSPACE/examples/experimental/reference.json" "$GITHUB_WORKSPACE/examples/experimental/candidate.json" --contract "$GITHUB_WORKSPACE/examples/experimental/contract.json" --report /tmp/symq-profile.json --html /tmp/symq-profile.html
  sanitizers:
    # AddressSanitizer + UndefinedBehaviorSanitizer build of the C core, in a scratch copy.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
        env:
          SYMQ_REQUIRE_NATIVE: '1'
      - run: python tools/sanitize_native.py

  coverage:
    # Branch coverage of the maintained core (symq, symq.sat, symq.backends, generators) by the
    # core-tier tests alone. The floor is the measured figure minus two points (87 % when it was
    # set): it catches a drop, it is not a target. Raise it when the measure rises for good.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat,checkout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -n auto -m "core and not timing" --cov --cov-report=
      - run: python -m pytest -q -m "core and timing" --cov --cov-append --cov-report=term --cov-report=xml:coverage/core.xml --cov-fail-under=85
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: coverage-core
          path: coverage/
  ci-ok:
    # The one check to require in branch protection: it fails unless every job above succeeded,
    # so a skipped or cancelled job cannot be mistaken for a pass.
    if: always()
    needs: [test, typecheck, macos, windows-pure, pure-python, qcec-crosscheck, wheel, sanitizers, coverage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every required job succeeded
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          for result in $RESULTS; do
            test "$result" = success
          done
