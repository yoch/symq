name: Formal runtime CNF soundness research
on:
  pull_request:
    paths:
      - 'formal/symq_runtime/**'
      - 'src/symq/labs/kraus_graph.py'
      - 'tests/test_formal_runtime_contract.py'
      - 'tests/test_formal_phase_bits.py'
      - 'tests/test_formal_axioms.py'
      - 'tests/test_formal_graph_rewrites.py'
      - 'tests/test_formal_flat_cnf.py'
      - 'tests/test_formal_graph_snapshot.py'
      - 'tools/formal_graph_snapshot.py'
      - 'tools/check_formal_axioms.py'
      - 'docs/labs/formal-runtime-soundness.md'
      - '.github/workflows/formal-runtime-cnf.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q tests/test_formal_runtime_contract.py tests/test_formal_phase_bits.py tests/test_formal_axioms.py tests/test_formal_graph_rewrites.py tests/test_formal_flat_cnf.py tests/test_formal_graph_snapshot.py tests/test_kraus_graph.py
      - run: |
          mkdir -p evidence/formal-runtime
          git rev-parse HEAD > evidence/formal-runtime/commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/formal-runtime/tree.txt
          git diff --exit-code
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee
        with:
          lake-package-directory: formal/symq_runtime
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Verify Lean theorems and print axiom dependencies
        run: |
          set -o pipefail
          (cd formal/symq_runtime && lean GateCNF.lean && lean PhaseBits.lean && lean AcyclicDAG.lean && lean GraphRewrites.lean) 2>&1 | tee evidence/formal-runtime/theorems.log
          (cd formal/symq_runtime && lake env lean Contracts.lean) 2>&1 | tee evidence/formal-runtime/contracts.log
          python tools/check_formal_axioms.py evidence/formal-runtime/theorems.log --sources formal/symq_runtime
          git diff --exit-code
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: formal-runtime-cnf-evidence
          path: evidence/formal-runtime/
          if-no-files-found: error
