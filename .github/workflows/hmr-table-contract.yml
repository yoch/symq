name: HMR table-loader contract research
on:
  pull_request:
    paths:
      - 'src/symq/labs/hmr_table_contract.py'
      - 'src/symq/experimental/hybrid.py'
      - 'src/symq/experimental/serialization.py'
      - 'src/symq/resources.py'
      - 'tests/test_hmr_table_contract.py'
      - 'tests/testkit/table_channel_oracle.py'
      - 'tests/testkit/hmr_table_cases.py'
      - 'benchmarks/hmr_table_contract.py'
      - 'benchmarks/environment.py'
      - 'docs/guide/hmr-table-contract.md'
      - '.github/workflows/hmr-table-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q tests/test_hmr_table_contract.py tests/test_public_docs.py
      - run: python -m benchmarks.hmr_table_contract --output evidence/hmr-table-contract.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hmr-table-contract-evidence
          path: evidence/hmr-table-contract.json
          if-no-files-found: warn
