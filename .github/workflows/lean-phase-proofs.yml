name: Lean kernel checked LRAT research
on:
  pull_request:
    paths:
      - 'src/symq/labs/lrat_*.py'
      - 'src/symq/labs/phase_proof_bundle.py'
      - 'src/symq/labs/phase_factored.py'
      - 'src/symq/labs/phase_discovery.py'
      - 'src/symq/labs/kraus_graph.py'
      - 'src/symq/labs/nonlinear_phase_bits.py'
      - 'src/symq/resources.py'
      - 'formal/portable_lrat/**'
      - 'tests/test_lrat_lean.py'
      - 'tests/test_lrat_rup.py'
      - 'tests/test_phase_proof_bundle.py'
      - 'benchmarks/lean_phase_proofs.py'
      - 'docs/labs/lean-kernel-proofs.md'
      - '.github/workflows/lean-phase-proofs.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q tests/test_lrat_lean.py
      - run: |
          mkdir -p evidence/lean
          git rev-parse HEAD > evidence/lean/commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/lean/tree.txt
          git diff --exit-code
          python -m benchmarks.lean_phase_proofs generate --output-dir evidence/lean
      - uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64
        with:
          lake-package-directory: formal/portable_lrat
          auto-config: 'false'
          build: 'true'
          test: 'false'
          lint: 'false'
          use-mathlib-cache: 'false'
          use-github-cache: 'false'
      - name: Kernel reduction, no native computation oracle and no SAT package
        run: |
          python -m pip uninstall -y python-sat
          python -m benchmarks.lean_phase_proofs check --output-dir evidence/lean
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: lean-kernel-phase-proofs-evidence
          path: evidence/lean/
          if-no-files-found: error
