name: Nightly
# What no commit causes: a new release of a dependency, a new Python, a new wheel builder.
# Runs on the default branch's schedule and checks main and every release branch, so that a
# release branch that nobody touches still learns that its dependencies moved.
# Nothing here is a required check and nothing is published.
on:
  schedule:
    - cron: '17 3 * * *'   # every night: fresh dependencies, next Python
    - cron: '47 3 * * 1'   # Mondays: the whole wheel matrix as well
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: true
jobs:
  branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          REMOTE: ${{ github.server_url }}/${{ github.repository }}
        run: |
          git ls-remote --heads "$REMOTE" 'refs/heads/release/*' > heads.txt
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          heads = [line.split("refs/heads/", 1)[1].strip() for line in open("heads.txt") if line.strip()]
          print("list=" + json.dumps(["main", *sorted(heads)]))
          PY

  fresh-dependencies:
    # The newest release of every dependency, development releases of python-sat included: the
    # ordinary jobs install them too, but only when someone pushes.
    needs: branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.list) }}
        python-version: ['3.10', '3.14']
    env:
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --upgrade --upgrade-strategy eager -e ".[test]"
      - run: python -m pip freeze
      - run: python -m pytest -q -n auto -m "core and not timing"
      - run: python -m pytest -q -m "core and timing"

  next-python:
    # The Python after the newest supported one. Informational: a failure here is news about
    # the future, not a defect of a release.
    needs: branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.list) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - run: python -m pip install -e ".[test]"
      - run: python -m symq doctor
      - run: python -m pytest -q -n auto -m "core and not timing"

  wheels:
    # Mondays and manual runs: the release build without the release. Every wheel of the matrix
    # is built from a source distribution and tested, on each architecture, so that a wheel
    # builder or a base image that moved shows here and not on release day.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 3 * * 1'
    needs: branches
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.list) }}
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install "build>=1.2,<2"
      - run: python -m build --sdist -o dist .
      - id: sdist
        run: echo "path=$(ls dist/symq-*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
