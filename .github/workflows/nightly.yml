name: Nightly
# What no commit causes: a new release of a dependency (python-sat, pytest, hypothesis, the
# build backend), a new Python, a new runner image.
# Runs on the default branch's schedule and checks main and every release branch, so that a
# release branch that nobody touches still learns that its dependencies moved.
# Nothing here is a required check and nothing is published. A red run is the signal; the
# look at the next Python never turns the run red (see that job).
on:
  schedule:
    - cron: '17 3 * * 0,2-6'   # every night but Monday: fresh dependencies, next Python
    - cron: '47 3 * * 1'       # Mondays: the same, and the whole wheel matrix
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: true
jobs:
  branches:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.list.outputs.list }}
    steps:
      - id: list
        env:
          # Through the API with the job's token: an anonymous git request would stop working
          # the day the repository is not public.
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/branches" --paginate --jq '.[].name' > branches.txt
          python3 - >> "$GITHUB_OUTPUT" <<'PY'
          import json
          names = [line.strip() for line in open("branches.txt")]
          print("list=" + json.dumps(["main", *sorted(n for n in names if n.startswith("release/"))]))
          PY

  fresh-dependencies:
    # The newest release of every dependency, development releases of python-sat included: the
    # ordinary jobs install them too, but only when someone pushes.
    needs: branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.list) }}
        python-version: ['3.10', '3.14']
    env:
      SYMQ_REQUIRE_NATIVE: '1'
      SYMQ_TEST_REQUIRE: native,sat
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --upgrade --upgrade-strategy eager -e ".[test]"
      - run: python -m pip freeze
      - run: python -m pytest -q -n auto -m "core and not timing"
      - run: python -m pytest -q -m "core and timing"

  next-python:
    # The Python after the newest supported one. Informational: a failure here is news about
    # the future, not a defect of a release.
    needs: branches
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.list) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
          allow-prereleases: true
      - run: python -m pip install -e ".[test]"
      - run: python -m symq doctor
      - run: python -m pytest -q -n auto -m "core and not timing"

  wheels:
    # Mondays and manual runs: the release build without the release. Every wheel of the matrix
    # is built from a source distribution and tested, on each architecture. The wheel builder
    # and its container images are pinned (by the action's commit), so what can move under this
    # job is the runner image, the build backend and the test dependencies. The builder used
    # here is the one pinned on the default branch, for every branch.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '47 3 * * 1'
    needs: branches
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        branch: ${{ fromJSON(needs.branches.outputs.list) }}
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ matrix.branch }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install "build>=1.2,<2"
      - run: python -m build --sdist -o dist .
      - id: sdist
        run: echo "path=$(ls dist/symq-*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
