name: Nonlinear phase-bit certificates research
on:
  pull_request:
    paths:
      - 'src/symq/labs/nonlinear_phase_bits.py'
      - 'src/symq/labs/kraus_graph.py'
      - 'src/symq/labs/affine_phase.py'
      - 'src/symq/resources.py'
      - 'tests/test_nonlinear_phase_bits.py'
      - 'tests/test_nonlinear_phase_independent.py'
      - 'tests/testkit/nonlinear_phase_cohort.py'
      - 'tests/testkit/affine_phase_oracle.py'
      - 'tests/testkit/nonlinear_phase_cases.py'
      - 'tests/testkit/affine_phase_oracle.py'
      - 'benchmarks/nonlinear_phase_bits.py'
      - 'docs/labs/nonlinear-phase-bits.md'
      - '.github/workflows/nonlinear-phase-bits.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMQ_TEST_REQUIRE: sat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q tests/test_nonlinear_phase_bits.py tests/test_nonlinear_phase_independent.py tests/test_kraus_graph.py
      - run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/tree.txt
          git diff --exit-code
          python -m benchmarks.nonlinear_phase_bits --output evidence/nonlinear-phase-bits.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: nonlinear-phase-bits-evidence
          path: evidence/
          if-no-files-found: error
