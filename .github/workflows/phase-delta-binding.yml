name: Phase delta binding research
on:
  pull_request:
    paths:
      - 'src/symq/**'
      - 'tests/test_phase_delta_binding*.py'
      - 'tests/test_phase_quotient*.py'
      - 'tests/testkit/phase_delta_oracle.py'
      - 'benchmarks/phase_delta_binding.py'
      - 'benchmarks/phase_quotient.py'
      - 'benchmarks/corpus/**'
      - 'docs/guide/phase-delta-binding.md'
      - 'pyproject.toml'
      - '.github/workflows/phase-delta-binding.yml'
  push:
    branches: [main]
    paths:
      - 'src/symq/**'
      - 'tests/test_phase_delta_binding*.py'
      - 'tests/testkit/phase_delta_oracle.py'
      - 'benchmarks/phase_delta_binding.py'
      - 'benchmarks/phase_quotient.py'
      - 'benchmarks/corpus/**'
      - '.github/workflows/phase-delta-binding.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-phase-delta-binding-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYMQ_SKIP_NATIVE: '1'
      SYMQ_TEST_REQUIRE: checkout
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_phase_delta_binding.py tests/test_phase_delta_binding_qualification.py tests/test_phase_quotient.py tests/test_phase_quotient_qualification.py tests/test_public_api.py
      - name: Reproduce bounded development qualification
        run: python -m benchmarks.phase_delta_binding --repetitions 3 --output evidence/phase-delta-binding.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: phase-delta-binding-evidence
          path: evidence/
          if-no-files-found: error
