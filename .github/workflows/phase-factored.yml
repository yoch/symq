name: Factored phase certificate research
on:
  pull_request:
    paths:
      - 'src/symq/labs/phase_factored.py'
      - 'src/symq/labs/phase_discovery.py'
      - 'src/symq/labs/nonlinear_phase_bits.py'
      - 'src/symq/labs/affine_phase.py'
      - 'src/symq/labs/kraus_graph.py'
      - 'src/symq/resources.py'
      - 'tests/test_phase_factored.py'
      - 'tests/test_phase_revocation.py'
      - 'tests/test_phase_independent_cohort.py'
      - 'tests/testkit/phase_mixing_cohort.py'
      - 'src/symq/labs/phase_adaptive.py'
      - 'src/symq/labs/phase_separator.py'
      - 'tests/testkit/affine_phase_oracle.py'
      - 'tests/testkit/nonlinear_phase_cases.py'
      - 'benchmarks/phase_factored.py'
      - 'docs/labs/phase-factored.md'
      - '.github/workflows/phase-factored.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMQ_TEST_REQUIRE: sat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q tests/test_phase_factored.py tests/test_nonlinear_phase_bits.py tests/test_phase_discovery_adversarial.py tests/test_phase_revocation.py tests/test_phase_independent_cohort.py
      - run: |
          mkdir -p evidence
          git rev-parse HEAD > evidence/commit.txt
          git rev-parse 'HEAD^{tree}' > evidence/tree.txt
          git diff --exit-code
          python -m benchmarks.phase_factored --output evidence/phase-factored.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-factored-evidence
          path: evidence/
          if-no-files-found: error
