name: Phase quotient research
on:
  pull_request:
    paths:
      - 'src/symq/**'
      - 'tests/test_phase_quotient*.py'
      - 'benchmarks/phase_quotient.py'
      - 'benchmarks/corpus/**'
      - 'docs/guide/phase-quotient.md'
      - 'pyproject.toml'
      - '.github/workflows/phase-quotient.yml'
  push:
    branches: [main]
    paths:
      - 'src/symq/**'
      - 'tests/test_phase_quotient*.py'
      - 'benchmarks/phase_quotient.py'
      - 'benchmarks/corpus/**'
      - '.github/workflows/phase-quotient.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: research-phase-quotient-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SYMQ_SKIP_NATIVE: '1'
      SYMQ_TEST_REQUIRE: checkout
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_phase_quotient.py tests/test_phase_quotient_qualification.py tests/test_phase8_research.py tests/test_public_api.py
      - name: Reproduce bounded development qualification
        run: python -m benchmarks.phase_quotient --repetitions 3 --output evidence/phase-quotient.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-quotient-evidence
          path: evidence/
          if-no-files-found: error
