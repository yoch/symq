name: Release
# Builds one release (source distribution, pure-Python wheel, binary wheels), verifies it, and
# publishes it. PyPI's Trusted Publisher names this file and the environments `pypi` and
# `testpypi`: renaming any of them breaks publication.
#
#   * a tag `vX.Y.Z` pushed on `release/X.Y`  -> build, verify, PyPI, GitHub Release;
#   * a manual run with target `testpypi`      -> build, verify, TestPyPI (a rehearsal);
#   * a manual run with target `none`          -> build and verify only.
#
# Nothing is published unless every wheel was built from the source distribution, installed and
# tested, and the set of files is exactly one release (tools/release_check.py).
#
# What this file cannot do for itself (RELEASING.md, "Once per repository"): a tag or a manual
# run takes this very file from the ref it runs on, so whoever may push a `v*` tag may also
# change the checks. The protection is in the repository settings: a ruleset on `v*` tags, an
# environment `pypi` that exists beforehand with a required reviewer, and Trusted Publishers
# that each accept one environment only.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: Where to publish this rehearsal
        type: choice
        options: [none, testpypi]
        default: none
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  preflight:
    # The tag names the version of the tree, the commit is on the release branch of its series,
    # and the changelog has the section the release notes are made of.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - id: check
        env:
          REF: ${{ github.ref }}
        # No pipe: without pipefail a failing check would be hidden by the command after it.
        run: |
          python tools/release_check.py preflight --ref "$REF" --notes release-notes.md > preflight.txt
          cat preflight.txt
          cat preflight.txt >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release-notes
          path: release-notes.md
          if-no-files-found: error

  sdist-pure:
    # The source distribution, and the pure-Python wheel that serves every platform without a
    # binary wheel (Windows, free-threaded CPython, other architectures).
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install "build>=1.2,<2" "twine>=6,<8"
      - run: python -m build --sdist -o dist .
      # The pure wheel is built from the source distribution, like every binary wheel.
      - run: python -m pip wheel --no-deps -w dist dist/*.tar.gz
        env:
          SYMQ_SKIP_NATIVE: '1'
      - run: python -m twine check --strict dist/*
      - run: python tools/pypi_readme.py --check dist/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-sdist-pure
          path: dist/
          if-no-files-found: error

  wheels:
    # Binary wheels, built from the source distribution on a runner of each architecture.
    # The matrix of Pythons and platforms is [tool.cibuildwheel] in pyproject.toml; each wheel
    # is installed and tested there before it is kept.
    needs: sdist-pure
    runs-on: ${{ matrix.os }}
    # A job's timeout-minutes also ran out while the job waited for a macOS runner (release run
    # 43243831559, 2026-11-12): on macOS the job limit is generous and each step bounds its own
    # running time instead.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 120 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        # x86-64 and arm64 Linux, Intel and Apple-silicon macOS.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-15]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: dist-sdist-pure
          path: dist
      - id: sdist
        timeout-minutes: 5
        run: echo "path=$(ls dist/symq-*.tar.gz)" >> "$GITHUB_OUTPUT"
      - uses: pypa/cibuildwheel@f9b966cfadf4109556cadc5bb39ddb72d0ce664e # v4.3.5
        timeout-minutes: 50
        with:
          package-dir: ${{ steps.sdist.outputs.path }}
          output-dir: wheelhouse
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: dist-wheels-${{ matrix.os }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  verify:
    # The files form exactly one release: 24 binary wheels, each with its native core, one
    # pure wheel, one source distribution, nothing else. Their SHA-256 are recorded.
    needs: [preflight, wheels]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sums: ${{ steps.sums.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - run: python -m pip install "twine>=6,<8" && python -m twine check --strict dist/*.whl dist/*.tar.gz
      - run: python tools/pypi_readme.py --check dist/*.whl dist/*.tar.gz
      # Last, after every tool that touches dist/: the checksums are of the files as uploaded.
      - run: python tools/release_check.py artifacts dist --write-sums
      - id: sums
        # The digest of the checksum file travels as a job output, outside the artifact: the
        # publishing jobs check what they downloaded against it.
        run: |
          cat dist/SHA256SUMS
          digest=$(sha256sum dist/SHA256SUMS | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: dist/
          if-no-files-found: error

  install:
    # What a user gets: pip, given only the built files, picks the right wheel on each platform.
    needs: [preflight, verify]
    runs-on: ${{ matrix.os }}
    # A job's timeout-minutes also ran out while the job waited for a macOS runner (release run
    # 43243831559, 2026-11-12): on macOS the job limit is generous and each step bounds its own
    # running time instead.
    timeout-minutes: ${{ startsWith(matrix.os, 'macos') && 90 || 15 }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, python: '3.11', native: true}
          - {os: ubuntu-latest, python: '3.14', native: true}
          - {os: ubuntu-24.04-arm, python: '3.12', native: true}
          - {os: macos-15, python: '3.12', native: true}
          - {os: macos-15-intel, python: '3.12', native: true}
          # No binary wheel exists for these: pip must fall back to the pure wheel, not build.
          - {os: windows-latest, python: '3.12', native: false}
          - {os: ubuntu-latest, python: '3.14t', native: false}
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        timeout-minutes: 5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        timeout-minutes: 5
        with:
          name: release
          path: dist
      # --only-binary: a silent build from the source distribution would hide a missing wheel.
      - run: python -m pip install --no-index --find-links dist --only-binary symq "symq==$VERSION"
        timeout-minutes: 5
      - run: python -m symq --version
        timeout-minutes: 2
      - if: matrix.native
        run: python -m symq doctor --require-native
        timeout-minutes: 2
      - if: ${{ !matrix.native }}
        timeout-minutes: 2
        run: |
          python -m symq doctor
          python -c "from symq import BACKENDS, has_native; assert not has_native() and 'zdd' in BACKENDS"
      - name: A classical check gives the documented exit codes
        timeout-minutes: 2
        run: |
          printf '{"width": 3, "gates": [["ccx", [0, 1, 2]]]}' > toffoli.json
          printf '{"width": 3, "gates": []}' > empty.json
          python -m symq check toffoli.json toffoli.json
          if python -m symq check toffoli.json empty.json; then exit 1; else test $? -eq 1; fi

  testpypi:
    # A rehearsal: the same files, to the test index. Manual runs only.
    if: github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi'
    needs: [verify, install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: The files are the verified ones
        env:
          SUMS: ${{ needs.verify.outputs.sums }}
        run: |
          echo "$SUMS  dist/SHA256SUMS" | sha256sum -c -
          cd dist && sha256sum -c SHA256SUMS
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist

  pypi:
    # The release itself. Tags only. The job waits for approval only if the `pypi` environment
    # was created with a required reviewer: GitHub creates a missing environment on first use,
    # unprotected.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [verify, install]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: The tag still points at the commit that was built
        # A run can wait for approval while its tag is deleted and pushed again elsewhere.
        run: |
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          resolved=$(git ls-remote "$remote" "refs/tags/$GITHUB_REF_NAME^{}" | cut -f1)
          if [ -z "$resolved" ]; then
            resolved=$(git ls-remote "$remote" "refs/tags/$GITHUB_REF_NAME" | cut -f1)
          fi
          test "$resolved" = "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: The files are the verified ones
        env:
          SUMS: ${{ needs.verify.outputs.sums }}
        run: |
          echo "$SUMS  dist/SHA256SUMS" | sha256sum -c -
          cd dist && sha256sum -c SHA256SUMS
      - run: rm dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist

  github-release:
    # After PyPI accepted the files: provenance attestations, then the GitHub Release with the
    # same files, their checksums and the changelog section as notes.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [preflight, verify, pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: The tag still points at the commit that was built
        # A run can wait for approval while its tag is deleted and pushed again elsewhere.
        run: |
          remote="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          resolved=$(git ls-remote "$remote" "refs/tags/$GITHUB_REF_NAME^{}" | cut -f1)
          if [ -z "$resolved" ]; then
            resolved=$(git ls-remote "$remote" "refs/tags/$GITHUB_REF_NAME" | cut -f1)
          fi
          test "$resolved" = "$GITHUB_SHA"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: dist
      - name: The files are the verified ones
        env:
          SUMS: ${{ needs.verify.outputs.sums }}
        run: |
          echo "$SUMS  dist/SHA256SUMS" | sha256sum -c -
          cd dist && sha256sum -c SHA256SUMS
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-notes
          path: notes
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          prerelease=""
          case "$VERSION" in *rc*) prerelease="--prerelease" ;; esac
          gh release create "$TAG" dist/* --verify-tag --title "SymQ $VERSION" --notes-file notes/release-notes.md $prerelease
