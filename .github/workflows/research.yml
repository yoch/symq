name: Research evidence
# Regenerated research reports, external-engine comparisons and informational timings. They
# qualify research on ``main`` and on every pull request, as before the split; they are not
# required checks (see ci.yml) and do not run on pushes to a release branch.
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: research-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-frontier:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -e ".[dev,source]"
      - run: python -m pytest -q tests/test_kmb_resource_frontier.py tests/test_kmb_resource_frontier_optional.py
      - run: python -m benchmarks.kmb_resource_frontier --output evidence/frontier-dev.json --repetitions 3
      - run: python -m pytest -q tests/test_reset_cache.py tests/test_kmb_reset_cache.py tests/test_kmb_reset_cache_replay_io.py tests/test_kmb_reset_cache_publication.py
      - run: python -m benchmarks.reset_cache --output evidence/reset-cache-dev.json
      - run: python -m benchmarks.kmb_reset_cache --output evidence/kmb-cache-dev.json
      - run: python -m pytest -q tests/test_kmb_affine_resources.py
      - run: python -m benchmarks.kmb_affine_resources --output evidence/kmb-affine-dev.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: source-frontier-${{ matrix.python-version }}
          path: evidence/
  external:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev,external]"
      - run: python -c "from symq import external; assert not external.UNAVAILABLE, external.UNAVAILABLE; print(external.versions())"
      - run: python -m pytest -q tests/test_external.py tests/test_phase8_external.py tests/test_experimental_phases.py
      # SAT against MQT QCEC on the arithmetic substitution pairs; fails on any mismatch.
      - run: python -m benchmarks.substitution_crosscheck --output evidence/substitution-crosscheck.json
      # Comparative development campaign on this exact commit (not a holdout): 13 cases and 35
      # coverage cells once, then four preregistered cases with 15 paired repetitions.
      - run: python -m benchmarks.comparative --output evidence/comparative-coverage.json --repetitions 1
      - run: python -m benchmarks.comparative_report --input evidence/comparative-coverage.json --output evidence/comparative-coverage.md
      - run: >-
          python -m benchmarks.comparative --output evidence/comparative-paired.json --repetitions 15
          --case kmb-gf16-original-vs-tower
          --case borrowed-dirty-missing-uncompute
          --case qualtran-m1-hmr-cleanup
          --case qualtran-m1-hmr-missing-correction
      - run: python -m benchmarks.comparative_report --input evidence/comparative-paired.json --output evidence/comparative-paired.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: external-evidence
          path: evidence/
  research-evidence:
    # Regenerates the pinned research reports; each command fails on a broken claim.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      # The four Qualtran cases through symq rewrite --isolate and symq replay, on versioned files.
      - run: python -m benchmarks.rewrite_qualtran_hmr --output-dir evidence/qualtran-hmr-cli
      # The public gf16-07 KMB in a 13-wire context, through the CLI, with its three refusals.
      - run: python -m benchmarks.rewrite_kmb_context --output-dir evidence/kmb-context-cli
      - run: python -m benchmarks.bilinear_kmb --output evidence/bilinear-kmb.json
      - run: python -m benchmarks.gf24_tower_qualification --output evidence/gf24-tower.json
      - run: python -m benchmarks.substitution_qualification --output evidence/substitution-qualification.json
      # Rewrite CLI receipts: an exact advisory cut location, then --engine auto and a full replay.
      - run: python -m symq locate examples/locate/source.json examples/locate/reference.json --theorem classical > evidence/locate.json
      - run: python -c 'import json; d=json.load(open("evidence/locate.json")); assert d["advisory_only"] and d["status"]=="unique" and d["matches"][0]["wires"]==[4,1,6] and d["matches"][0]["span"]==[1,3]'
      - run: python -m symq rewrite examples/rewrite/request.json --engine auto --report evidence/rewrite-auto.json > evidence/rewrite-auto-status.json
      - run: python -m symq replay evidence/rewrite-auto.json > evidence/rewrite-auto-replay.json
      - run: python -c 'import json; s=json.load(open("evidence/rewrite-auto-status.json")); r=json.load(open("evidence/rewrite-auto-replay.json")); assert s["result"]["engine"]=="sat" and s["result"]["outcome"]=="equivalent" and r["replay"]["reverified"]'
      # Prepare a local block with 0-based wires, then prove it in a distinct
      # CLI step: no candidate is authorized by the preparation itself.
      - run: >-
          python -m symq prepare-rewrite
          examples/prepare/source.json
          examples/prepare/original.json
          examples/prepare/candidate.json
          --contract examples/prepare/contract.json
          --weights examples/prepare/weights.json
          --engine auto --output-dir evidence/prepared-local
          > evidence/prepared-status.json
      - run: >-
          python -m symq rewrite evidence/prepared-local/request.json --isolate
          --report evidence/prepared-local/proof.json > evidence/prepared-verdict.json
      - run: python -m symq replay evidence/prepared-local/proof.json > evidence/prepared-replay.json
      - run: >-
          python -c 'import json; p=json.load(open("evidence/prepared-status.json")); v=json.load(open("evidence/prepared-verdict.json")); r=json.load(open("evidence/prepared-replay.json")); assert p["status"]=="ready_for_proof" and not p["proved"] and not p["candidate_authorized"] and p["location"]["matches"][0]["wires"]==[4,1,6] and v["result"]["engine"]=="packed" and v["result"]["outcome"]=="equivalent" and r["replay"]["reverified"]'
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: research-evidence
          path: evidence/
  quick-bench:
    # Informational: relative timings for review, published as an artifact. Never blocks.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: |
          python -m benchmarks.quick --split dev --output bench-dev.json
          python -m benchmarks.quick --split synthetic --backends zdd-native sat --output bench-synthetic.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-bench
          path: bench-*.json
