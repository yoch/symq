name: Shift-diagonal ancilla research
on:
  push:
    branches: [main]
    paths:
      - 'src/symq/labs/shift_diagonal_ancilla.py'
      - 'src/symq/labs/backward_ancilla.py'
      - 'src/symq/experimental/hybrid.py'
      - 'src/symq/resources.py'
      - 'benchmarks/shift_diagonal_ancilla.py'
      - 'benchmarks/backward_ancilla.py'
      - 'benchmarks/corpus/qualtran/**'
      - 'tests/test_shift_diagonal*.py'
      - 'tests/test_backward_ancilla*.py'
      - 'tests/test_public_docs.py'
      - 'tests/testkit/sparse_branch_oracle.py'
      - 'benchmarks/environment.py'
      - 'src/symq/labs/__init__.py'
      - 'src/symq/errors.py'
      - 'src/symq/circuit.py'
      - 'docs/guide/shift-diagonal-ancilla.md'
      - '.github/workflows/shift-diagonal-ancilla.yml'
  pull_request:
    paths:
      - 'src/symq/labs/shift_diagonal_ancilla.py'
      - 'src/symq/labs/backward_ancilla.py'
      - 'src/symq/experimental/hybrid.py'
      - 'src/symq/resources.py'
      - 'benchmarks/shift_diagonal_ancilla.py'
      - 'benchmarks/backward_ancilla.py'
      - 'benchmarks/corpus/qualtran/**'
      - 'tests/test_shift_diagonal*.py'
      - 'tests/test_backward_ancilla*.py'
      - 'tests/test_public_docs.py'
      - 'tests/testkit/sparse_branch_oracle.py'
      - 'benchmarks/environment.py'
      - 'src/symq/labs/__init__.py'
      - 'src/symq/errors.py'
      - 'src/symq/circuit.py'
      - 'docs/guide/shift-diagonal-ancilla.md'
      - '.github/workflows/shift-diagonal-ancilla.yml'
permissions:
  contents: read
concurrency:
  group: shift-diagonal-ancilla-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e '.[dev]'
        env:
          SYMQ_SKIP_NATIVE: '1'
      - run: >-
          python -m pytest -q tests/test_shift_diagonal_ancilla.py
          tests/test_shift_diagonal_qualification.py tests/test_backward_ancilla.py
          tests/test_backward_ancilla_qualification.py tests/test_public_docs.py
      - run: >-
          python -m benchmarks.shift_diagonal_ancilla --repetitions 3
          --output evidence/shift-diagonal-ancilla.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: shift-diagonal-ancilla-evidence
          path: evidence/
