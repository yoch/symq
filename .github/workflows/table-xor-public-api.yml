name: Table XOR public API qualification
on:
  pull_request:
    paths:
      - 'src/symq/experimental/table_xor.py'
      - 'src/symq/experimental/__init__.py'
      - 'src/symq/labs/table_xor_contract.py'
      - 'tests/test_table_xor_public.py'
      - 'tests/test_table_xor_contract.py'
      - 'docs/guide/table-xor-public-api.md'
      - '.github/workflows/table-xor-public-api.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SYMQ_TEST_REQUIRE: sat
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: python -m pytest -q tests/test_table_xor_public.py tests/test_table_xor_contract.py tests/test_public_api.py
      - run: >-
          python -m benchmarks.table_xor_contract
          --source examples/table_xor/linear.json
          --contract examples/table_xor/contract.json
          --backend sat --repetitions 3
          --output evidence/table-xor-public.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: table-xor-public-evidence
          path: evidence/table-xor-public.json
          if-no-files-found: error
