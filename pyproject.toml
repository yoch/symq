[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "symq"
version = "0.1.0"
description = "Exact symbolic Boolean algebra and reversible-circuit research"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "symq contributors"}]
keywords = ["boolean algebra", "ANF", "reversible circuits", "formal verification"]
classifiers = ["Development Status :: 2 - Pre-Alpha", "Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]
dependencies = []

[project.scripts]
symq = "symq.__main__:main"

[project.optional-dependencies]
native = []
test = ["pytest>=8", "hypothesis>=6", "python-sat>=1.8.dev13", "pyyaml>=6"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.7", "python-sat>=1.8.dev13", "pyyaml>=6"]
# SAT decision engine (symq.sat): optional at runtime, but installed for the test job so the
# encoder and the witness checks actually run in CI instead of being skipped.
sat = ["python-sat>=1.8.dev13"]
# Native baselines for the comparative benchmark (symq.external); not needed by symq itself.
external = ["dd>=0.6", "passagemath-brial>=10.8", "passagemath-environment>=10.8", "mqt.qcec>=3.11"]

[tool.hatch.build.targets.wheel]
packages = ["src/symq"]

# Optional C core of the ZDD backends. ``optional = true``: without a compiler the build
# succeeds and ``symq.backends.zdd_native`` simply cannot be imported.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"
# Frozen research snapshots are pinned by MANIFEST.sha256 and must stay byte-identical.
extend-exclude = ["research/archive"]
