[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "symq"
version = "0.1.0"
description = "Exact Boolean ANF and reversible-circuit verification, with opt-in coherent HMR research"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "symq contributors"}]
keywords = ["boolean algebra", "ANF", "reversible circuits", "formal verification", "ZDD"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yoch/symq"
Documentation = "https://github.com/yoch/symq/blob/main/docs/index.md"
Changelog = "https://github.com/yoch/symq/blob/main/CHANGELOG.md"
Issues = "https://github.com/yoch/symq/issues"

[project.scripts]
symq = "symq.__main__:main"

[project.optional-dependencies]
# SAT decision engine (symq.sat). python-sat publishes only development releases at the moment,
# hence the pre-release specifier.
sat = ["python-sat>=1.8.dev13"]
# Running the test suite (the SAT tests must run, not be skipped).
test = ["pytest>=8", "hypothesis>=6", "pyyaml>=6", "symq[sat]"]
dev = ["symq[test]", "ruff>=0.7", "mypy>=1.10"]
# Native baselines for the comparative benchmark (symq.external); not needed by symq itself.
external = ["dd>=0.6", "passagemath-brial>=10.8", "passagemath-environment>=10.8", "mqt.qcec>=3.11"]

[tool.hatch.build.targets.sdist]
# The sdist is the tracked repository (every file git tracks and does not ignore): it builds,
# installs and runs the whole test suite, which reads the corpora, examples, docs and workflows.
# CI extracts the tarball and runs pytest inside it.

[tool.hatch.build.targets.wheel]
packages = ["src/symq"]
# The compiled core ships as a build artifact; its C source belongs in the sdist only.
exclude = ["src/symq/backends/_zdd.c"]

# Optional C core of the ZDD backends. ``optional = true``: without a compiler the build
# succeeds and ``symq.backends.zdd_native`` simply cannot be imported.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
markers = [
    "native: needs the compiled native C core (skipped when it is not built)",
    "sat: needs an interruptible SAT solver from python-sat (skipped when absent)",
    "checkout: needs a git checkout whose src/symq is the imported package (skipped otherwise)",
    "slow: long-running checks that do not change a decision",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
files = ["src/symq"]
ignore_missing_imports = true
warn_unused_ignores = true

# Gradual typing: the opt-in experimental core and the research modules are not yet clean.
[[tool.mypy.overrides]]
module = ["symq.experimental.*", "symq.labs.*"]
ignore_errors = true
