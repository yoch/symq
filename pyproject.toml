[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "symq"
version = "0.4.0.dev0"
description = "Exact Boolean ANF and reversible-circuit verification, with opt-in coherent HMR research"
# The long description is README.md with its relative links made absolute for PyPI: see the
# metadata hook in hatch_build.py.
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
# The wheel holds src/symq only (MIT). The source distribution is the repository less one corpus
# (see the sdist target below) and carries third-party corpora under their own licences, listed
# in THIRD_PARTY_NOTICES.md.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "Joshua Melka"}]
maintainers = [{name = "Joshua Melka"}]
keywords = ["boolean algebra", "ANF", "reversible circuits", "formal verification", "ZDD"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/yoch/symq"
Documentation = "https://github.com/yoch/symq/blob/main/docs/index.md"
Changelog = "https://github.com/yoch/symq/blob/main/CHANGELOG.md"
Issues = "https://github.com/yoch/symq/issues"

[project.scripts]
symq = "symq.__main__:main"

[project.optional-dependencies]
# SAT decision engine (symq.sat). python-sat publishes only development releases at the moment,
# hence the pre-release specifier.
sat = ["python-sat>=1.8.dev13"]
source = ["numpy>=1.26"]
# Running the test suite (the SAT tests must run, not be skipped).
# hatchling: the build hooks (native core, PyPI description) have tests of their own.
test = ["pytest>=8", "pytest-xdist>=3", "pytest-cov>=5", "hypothesis>=6", "pyyaml>=6",
        "hatchling>=1.26", "symq[sat]"]
# Linter and type checker are held to one minor series: a new series changes which rules and
# checks apply, so moving to it is a reviewed change (Dependabot proposes it), not a surprise in CI.
dev = ["symq[test]", "ruff>=0.17.4,<0.18", "mypy>=2.4,<2.5"]
# Native baselines for the comparative benchmark (symq.external); not needed by symq itself.
external = ["dd>=0.6", "passagemath-brial>=10.8", "passagemath-environment>=10.8", "mqt.qcec>=3.11"]
# The one independent checker that the required CI job compares SymQ with. Held to one minor
# series so that an upstream release cannot turn the required check red by surprise: Dependabot
# proposes the next series in a pull request of its own.
crosscheck = ["mqt.qcec>=3.12,<3.13"]

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
# The sdist is the tracked repository (every file git tracks and does not ignore), less one
# corpus: it builds, installs and runs the test suite, which reads the corpora, examples, docs
# and workflows. CI extracts the tarball and runs pytest inside it.
#
# benchmarks/corpus/bilinear_kmb is not published: its licence is known from the declared field
# of its dataset page alone (see its SOURCE.md), which is enough to keep it in the repository
# and not enough to redistribute it in a release. The tests that read it carry the
# ``corpus_bilinear`` marker and are skipped, with that reason, where it is absent.
exclude = ["benchmarks/corpus/bilinear_kmb"]

[tool.hatch.metadata.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
# The oldest metadata version that has everything used here (the SPDX licence expression): an
# index that lags behind the newest version still accepts the upload.
core-metadata-version = "2.4"
packages = ["src/symq"]
# The compiled core ships as a build artifact; its C source belongs in the sdist only.
exclude = ["src/symq/backends/_zdd.c"]

# Optional C core of the ZDD backends. ``optional = true``: without a compiler the build
# succeeds and ``symq.backends.zdd_native`` simply cannot be imported.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# Binary wheels (release.yml). One wheel per CPython 3.11-3.14 on Linux (glibc and musl) and
# macOS, each built for the architecture of its runner; Windows gets the pure-Python wheel, since
# the C core is not ported to MSVC. The free-threaded builds are skipped: the core refuses them.
[tool.cibuildwheel]
build = "cp311-* cp312-* cp313-* cp314-*"
skip = ["cp3??t-*", "*_i686", "*-win*"]
archs = ["native"]
# A wheel without its native core must fail the build, not be published as a binary wheel.
environment = { SYMQ_REQUIRE_NATIVE = "1" }
test-requires = ["pytest>=8", "hypothesis>=6"]
test-command = "symq doctor --require-native && python -m pytest -q -p no:cacheprovider {project}/tests/test_zdd_native.py {project}/tests/test_native_limits.py {project}/tests/test_backends.py {project}/tests/test_equivalence.py {project}/tests/test_cli_check.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = ["-ra", "--strict-markers"]
# A test still running after this many seconds has every thread's traceback written to the
# log, and keeps running: a hang then names its test. The slowest test, a QCEC cross-check
# case, takes about 100 s; the CI jobs that run pytest time out after 15 to 30 minutes.
faulthandler_timeout = 300
markers = [
    "native: needs the compiled native C core (skipped when it is not built)",
    "sat: needs an interruptible SAT solver from python-sat (skipped when absent)",
    "checkout: needs a git checkout whose src/symq is the imported package (skipped otherwise)",
    "fault_injection: needs the instrumented C core of tools/sanitize_native.py (else skipped)",
    "corpus_bilinear: needs benchmarks/corpus/bilinear_kmb (in the repository, not in the sdist)",
    "qcec: needs MQT QCEC, the independent checker of the cross-check job (skipped when absent)",
    "core: tier (set automatically) - the maintained package and repository guards",
    "experimental: tier (set automatically) - reaches symq.experimental but not symq.labs",
    "labs: tier (set automatically) - reaches symq.labs research code",
    "timing: asserts an upper bound on real elapsed time; CI runs these serially, not under xdist",
]

# Coverage of the maintained core only: the opt-in experimental layer, the research modules and
# the optional comparison adapters are measured by their own tests, not by a core floor.
[tool.coverage.run]
source_pkgs = ["symq"]
branch = true
omit = ["*/symq/labs/*", "*/symq/experimental/*", "*/symq/external/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py311"
# No explicit ``select``: the enforced rules are the default set of the ruff series pinned in the
# ``dev`` extra (several hundred individual rules, which do not include the line-length rule E501).

[tool.mypy]
python_version = "3.11"
files = ["src/symq"]
ignore_missing_imports = true
warn_unused_ignores = true

# Gradual typing: the opt-in experimental core and the research modules are not yet clean.
[[tool.mypy.overrides]]
module = ["symq.experimental.*", "symq.labs.*"]
ignore_errors = true
